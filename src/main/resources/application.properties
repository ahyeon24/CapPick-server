spring.application.name=CapPickServer

# API 명세 §2: "JSON 필드명 snake_case". DTO는 camelCase로 짜고 Jackson이 자동 변환하게 한다 —
# 필드마다 @JsonProperty를 반복하지 않는다.
spring.jackson.property-naming-strategy=SNAKE_CASE

# 로컬 개발용 PostgreSQL 접속 정보. brew services로 띄운 로컬 인스턴스, cappick_dev DB를 가리킨다.
# 다른 사람 기기·CI에서는 이 값이 안 맞을 수 있다 — 환경별 분리(profile, 환경변수)는 아직 안 했다.
spring.datasource.url=jdbc:postgresql://localhost:5432/cappick_dev
spring.datasource.username=simahyeon
spring.datasource.password=

# 스키마 관리: Flyway(src/main/resources/db/migration)로 확정 (2026-09-22, 첫 엔터티 Installation
# 추가 시점 결정). Hibernate는 스키마를 만들거나 바꾸지 않고 Flyway가 만든 스키마와 일치하는지만 검증한다.
spring.jpa.hibernate.ddl-auto=validate

# 설치 검증(App Attest) 모드. development/production=실제 Apple 검증, bypass=검증 생략(로컬 개발 전용).
# Apple Developer Program 미가입 상태라 지금은 bypass가 유일하게 쓸 수 있는 값이다.
# 운영 환경에서 bypass가 켜지지 않도록 이 값은 반드시 환경마다 명시적으로 설정한다.
cappick.attestation.mode=bypass
cappick.attestation.apple.app-id=TEAMID.com.cappick.ios
cappick.attestation.apple.environment=development

# AI 공급자: Gemini로 우선 시작 (2026-09-22 사용자 결정, 추후 OpenAI와 비용·품질 비교 예정 —
# CapPick-server/CLAUDE.md 참고). 키는 절대 커밋하지 않는다 — 환경변수로만 주입한다.
cappick.ai.gemini.api-key=${GEMINI_API_KEY:}
# 2026-09-25: "gemini-flash-latest"(→gemini-3.8-flash, 9월 2일 출시)·gemini-3.7-flash 둘 다
# 503 "high demand"가 반복돼서, 출시 직후라 붐빈다는 가설은 기각했다(두 모델 다 같은 증상이라
# 특정 모델 문제가 아니라 무료 티어 우선순위 문제일 가능성이 큼 — 서버 CLAUDE.md 참고). 그래도
# 붐빌 이유가 적은 더 오래된 버전(2026-05-19 출시)으로 한 번 더 시도해본다. AI 공급자·모델 최종
# 확정은 아니다(여전히 미정).
# 2026-10-08: 비용 때문에 gemini-3.5-flash-lite로 내렸다(사용자 결정). 유료 단가가 flash의 약
# 1/4(입력 $0.30·출력 $2.50 / 1M)이고, 테스트 18장 실측으로 장당 약 1.4원이었다. flash-lite는
# 글자 많은 화면에서 OCR을 빠뜨리는 게 확인돼서 OCR은 앱이 기기에서 해서 보낸다(ocr_text 힌트,
# GeminiContentAnalysisClient 참고). 이 값은 검색어 해석(/v1/search/prepare)에도 같이 쓰인다 —
# 그쪽은 flash-lite로 실제 호출해 본 적이 아직 없다.
cappick.ai.gemini.model=gemini-3.5-flash-lite
cappick.ai.gemini.embedding-model=gemini-embedding-001
# 2026-09-26: classification은 이미 뽑아둔 텍스트를 폴더 기준과 비교하는 반복적인 구조화 판단이라
# content_analysis(이미지 이해)와 굳이 같은 모델을 쓸 필요가 없다고 판단해 분리했다. 무료 티어
# RPD가 모델별로 완전히 분리돼 있어서(AI Studio 실측: flash 계열은 전부 RPD 20, flash-lite는
# RPD 500) 이 분리만으로 하루 처리 가능한 캡처 수가 실질적으로 늘어난다 — GeminiProperties
# 클래스 주석 참고.
cappick.ai.gemini.classification-model=gemini-3.5-flash-lite

# 2026-09-27: 서버 전체가 Gemini 키 하나를 공유해서 쓰는 구조라(설치별 쿼터 분리 없음), 여러
# 설치가 동시에 쓰면 하루 RPD를 넘겨 전부 확인 불가능한 503으로 실패할 위험이 있다. 실측 RPD
# (content_analysis 계열 flash 모델 20, classification용 flash-lite 500 — AI Studio 대시보드
# 2026-09-26 확인)보다 살짝 낮은 값을 하루 예산으로 잡아, 넘기기 전에 명확한 사유(
# DAILY_BUDGET_EXHAUSTED)로 먼저 막는다. 설치별 공정 분배는 아직 안 한다 — 지금은 설치가
# 사실상 1개뿐이라 필요 없고, 진짜 다중 사용자가 생기면 그때 설계한다. 값을 0 이하로 두면 그
# 카테고리는 가드를 안 건다.
# 2026-10-08: content_analysis도 flash-lite로 옮기면서 두 kind가 같은 모델의 무료 RPD 500을
# 나눠 쓰게 됐다. 합이 450(안전 마진)이 되게 다시 나눴다 — 재분류는 classification 쪽 예산을 쓴다.
cappick.usage.daily-budget.content-analysis=200
cappick.usage.daily-budget.classification=250

# 스크린샷 하나가 기본 1MB 제한을 넘기 쉬워서 넉넉하게 잡았다 — 실제 업로드 크기 제한은
# API 명세 §8 "확정 전 필수 작업"의 미정 항목이라 이 값은 잠정치다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
